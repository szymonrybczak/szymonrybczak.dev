<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SR">
  <!-- Minimal SR monogram (Szymon Rybczak): white geometric letterforms on black. -->
  <rect width="32" height="32" fill="#000"/>
  <!-- S -->
  <g fill="#fff">
    <rect x="6" y="6" width="8" height="4"/>
    <rect x="6" y="6" width="4" height="10"/>
    <rect x="6" y="14" width="8" height="4"/>
    <rect x="10" y="14" width="4" height="12"/>
    <rect x="6" y="22" width="8" height="4"/>
  </g>
  <!-- R -->
  <g fill="#fff">
    <rect x="18" y="6" width="4" height="20"/>
    <rect x="18" y="6" width="8" height="4"/>
    <rect x="22" y="6" width="4" height="12"/>
    <rect x="18" y="14" width="8" height="4"/>
    <polygon points="20,18 22,18 26,26 24,26"/>
  </g>
</svg>
